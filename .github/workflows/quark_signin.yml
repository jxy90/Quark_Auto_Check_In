name: 夸克网盘每日签到

on:
  schedule:
    - cron: "17 1 * * *" # 北京时间 09:17，避开整点调度高峰
    - cron: "43 1 * * *" # 北京时间 09:43，首次签到兜底
    - cron: "23 5 * * *" # 北京时间 13:23，失败兜底并避开整点调度高峰
    - cron: "47 5 * * *" # 北京时间 13:47，最终兜底
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quark-signin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取北京时间日期
        id: date
        shell: bash
        run: echo "today=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 恢复今日成功标记
        id: cache-success
        uses: actions/cache/restore@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}

      - name: 今日已完成签到
        if: steps.cache-success.outputs.cache-hit == 'true'
        run: echo "今日已全部签到成功，跳过重复执行。"

      - name: 检出代码
        if: steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/checkout@v7

      - name: 随机延迟
        if: steps.cache-success.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            max_delay=10
          else
            max_delay=60
          fi
          delay=$((RANDOM % (max_delay + 1)))
          echo "随机延迟 ${delay} 秒后开始执行。"
          sleep "$delay"

      - name: 设置 Python 环境
        if: steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: steps.cache-success.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: 执行签到脚本
        id: sign-in
        if: steps.cache-success.outputs.cache-hit != 'true'
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
        shell: bash
        run: |
          set +e
          python checkIn_Quark.py | tee sign-in.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: 发送 Server 酱通知
        if: always() && steps.cache-success.outputs.cache-hit != 'true'
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SIGNIN_EXIT_CODE: ${{ steps.sign-in.outputs.exit_code }}
        shell: bash
        run: |
          if [ -z "$SERVERCHAN_SENDKEY" ]; then
            echo "未配置 SERVERCHAN_SENDKEY，跳过 Server 酱通知。"
            exit 0
          fi

          if [ "$SIGNIN_EXIT_CODE" = "0" ]; then
            title="夸克网盘签到成功"
          else
            title="夸克网盘签到失败"
          fi

          curl --fail --silent --show-error --max-time 20 \
            --data-urlencode "title=$title" \
            --data-urlencode "desp@sign-in.log" \
            "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
            || echo "Server 酱通知发送失败，请检查 SendKey 和推送通道配置。"

      - name: 生成今日成功标记
        if: success() && steps.cache-success.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/quark-signin
          echo "${{ steps.date.outputs.today }}" > .cache/quark-signin/success

      - name: 保存今日成功标记
        if: success() && steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}
